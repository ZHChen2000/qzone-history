name: Release GUI binary

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  windows-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build qzone-history-gui.exe
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: qzone-history-gui.exe
          append_body: true
          body: |
            ## Windows GUI（无黑窗口）
            直接下载 `qzone-history-gui.exe` 双击运行；与仓库根目录预编译包一致。
